openapi: 3.0.3
info:
  title: CrossFeed Notifications API
  description: 알림 조회 및 읽음 처리 API
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Development server
  - url: https://feed-app.vercel.app
    description: Production server

paths:
  /api/notifications:
    get:
      summary: 알림 목록 조회
      description: 사용자의 알림 목록을 조회합니다 (읽지 않은 알림 우선)
      tags:
        - Notifications
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          description: 한 페이지당 알림 수
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: 알림 목록 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationWithDetails'
                  unreadCount:
                    type: integer
                    description: 읽지 않은 알림 수
                    example: 3
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/notifications/{id}/read:
    patch:
      summary: 알림 읽음 처리
      description: 특정 알림을 읽음 상태로 변경합니다
      tags:
        - Notifications
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 알림 ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 읽음 처리 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: 권한 없음 (본인의 알림이 아님)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 알림을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/notifications/read-all:
    patch:
      summary: 모든 알림 읽음 처리
      description: 사용자의 모든 알림을 읽음 상태로 변경합니다
      tags:
        - Notifications
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 모든 알림 읽음 처리 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  updatedCount:
                    type: integer
                    description: 읽음 처리된 알림 수
                    example: 5
        '401':
          $ref: '#/components/responses/UnauthorizedError'

components:
  schemas:
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        recipientId:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
        type:
          type: string
          enum: [COMMENT]
          description: 알림 유형 (Phase 1은 COMMENT만)
        postId:
          type: string
          format: uuid
          nullable: true
        commentId:
          type: string
          format: uuid
          nullable: true
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time

    NotificationWithDetails:
      allOf:
        - $ref: '#/components/schemas/Notification'
        - type: object
          properties:
            actor:
              type: object
              description: 알림을 발생시킨 사용자
              properties:
                id:
                  type: string
                  format: uuid
                username:
                  type: string
                displayName:
                  type: string
                profileImageUrl:
                  type: string
                  format: uri
                  nullable: true
            post:
              type: object
              nullable: true
              description: 관련 포스트 (type=COMMENT 시 존재)
              properties:
                id:
                  type: string
                  format: uuid
                imageUrl:
                  type: string
                  format: uri
            message:
              type: string
              description: 사용자에게 표시할 알림 메시지
              example: john_doe님이 회원님의 게시물에 댓글을 남겼습니다

    Error:
      type: object
      required:
        - error
        - code
      properties:
        error:
          type: string
        code:
          type: integer

  responses:
    UnauthorizedError:
      description: 인증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
