openapi: 3.0.3
info:
  title: CrossFeed Comments API
  description: 댓글 생성, 조회, 삭제 API
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Development server
  - url: https://feed-app.vercel.app
    description: Production server

paths:
  /api/posts/{postId}/comments:
    get:
      summary: 댓글 목록 조회
      description: 특정 포스트의 모든 댓글을 시간순으로 조회합니다
      tags:
        - Comments
      security:
        - BearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          description: 포스트 ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 댓글 목록 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  comments:
                    type: array
                    items:
                      $ref: '#/components/schemas/CommentWithAuthor'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: 포스트를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: 댓글 생성
      description: 포스트에 새로운 댓글을 작성합니다
      tags:
        - Comments
      security:
        - BearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          description: 포스트 ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 500
                  example: 정말 멋져요! 👍
      responses:
        '201':
          description: 댓글 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: 포스트를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/comments/{id}:
    delete:
      summary: 댓글 삭제
      description: 자신의 댓글 또는 자신의 포스트에 달린 댓글을 삭제합니다
      tags:
        - Comments
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 댓글 ID
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 댓글 삭제 성공 (No Content)
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: 권한 없음 (본인의 댓글 또는 본인 포스트의 댓글이 아님)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "삭제 권한이 없습니다"
                code: 403
        '404':
          description: 댓글을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        postId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CommentWithAuthor:
      allOf:
        - $ref: '#/components/schemas/Comment'
        - type: object
          properties:
            author:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                username:
                  type: string
                displayName:
                  type: string
                profileImageUrl:
                  type: string
                  format: uri
                  nullable: true

    Error:
      type: object
      required:
        - error
        - code
      properties:
        error:
          type: string
        code:
          type: integer

  responses:
    UnauthorizedError:
      description: 인증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    BadRequestError:
      description: 잘못된 요청
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "댓글 내용을 입력해주세요"
            code: 400

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
